<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Largemouth Bass Aquaculture – PSO + EA Visualization</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d1a2e;
        color: #e0e8f0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
      }
      h1 {
        font-size: 1.3em;
        margin: 6px 0;
        color: #5ec4ff;
        text-align: center;
      }

      #top-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
        max-width: 1500px;
        margin-bottom: 6px;
      }

      #controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #111e30;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
      }
      button {
        background: #1a3a5c;
        color: #5ec4ff;
        border: 1px solid #2a5a8c;
        border-radius: 4px;
        padding: 5px 14px;
        cursor: pointer;
        font-size: 0.85em;
      }
      button:hover {
        background: #2a5a8c;
      }
      button.active {
        background: #2a7acc;
        color: #fff;
      }
      #time-display {
        font-size: 0.85em;
        color: #5ec4ff;
        min-width: 180px;
        text-align: center;
        font-family: "Consolas", monospace;
      }
      #speed-display {
        font-size: 0.82em;
        color: #8899aa;
        min-width: 60px;
        text-align: center;
        font-family: "Consolas", monospace;
      }

      #stats-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        padding: 7px 14px;
        background: #111e30;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        width: 100%;
        justify-content: center;
        align-items: center;
      }
      .stat-chip {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.78em;
      }
      .stat-chip-label {
        color: #8899aa;
      }
      .stat-chip-value {
        color: #e0e8f0;
        font-weight: bold;
        font-family: "Consolas", monospace;
        font-size: 0.9em;
      }

      #genotype-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        padding: 5px 14px;
        background: #111e30;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        width: 100%;
        justify-content: center;
        align-items: center;
        font-size: 0.72em;
      }
      .geno-chip {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .geno-chip-label {
        color: #667788;
      }
      .geno-chip-value {
        color: #aabbcc;
        font-family: "Consolas", monospace;
      }

      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 6px 12px;
        background: #111e30;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        width: 100%;
        justify-content: center;
        align-items: center;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.72em;
      }
      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid #3a5a7c;
        flex-shrink: 0;
      }
      .legend-swatch.circle {
        border-radius: 50%;
      }
      .legend-canvas {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .legend-bar {
        width: 20px;
        height: 5px;
        border-radius: 1px;
        flex-shrink: 0;
      }

      #progress-bar-container {
        width: 100%;
        height: 5px;
        background: #1e3a5f;
        border-radius: 3px;
        margin-top: 3px;
        cursor: pointer;
      }
      #progress-bar {
        height: 100%;
        background: #5ec4ff;
        border-radius: 3px;
        width: 0%;
      }

      #canvas-wrap {
        position: relative;
        border: 2px solid #1e3a5f;
        border-radius: 8px;
        overflow: hidden;
        background: #0f2540;
        width: 100%;
        max-width: 1500px;
        margin-top: 6px;
      }
      canvas {
        display: block;
        width: 100%;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 22, 40, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 100;
        font-size: 1.2em;
        color: #5ec4ff;
      }
      #loading.hidden {
        display: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #1e3a5f;
        border-top: 4px solid #5ec4ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading simulation data...</div>
    </div>

    <h1>Largemouth Bass Aquaculture -- PSO + EA Visualization</h1>

    <div id="top-bar">
      <div id="controls">
        <button id="btn-play" class="active">Play</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-restart">Restart</button>
        <button id="btn-slower">&lt;&lt;</button>
        <span id="speed-display">3 fps</span>
        <button id="btn-faster">&gt;&gt;</button>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.82em;
          "
        >
          <label>Frame:</label>
          <input
            type="range"
            id="frame-slider"
            min="0"
            max="100"
            value="0"
            style="width: 180px; accent-color: #5ec4ff"
          />
        </div>
        <div id="time-display">Day 00 | Hour 00 | Frame 0000/0000</div>
      </div>

      <div id="stats-bar"></div>
      <div id="genotype-bar"></div>

      <div id="legend">
        <!-- Fish -->
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-fish"></canvas>
          Fish
        </div>
        <!-- Objects -->
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-food"></canvas>
          Food
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-probiotic"></canvas>
          Probiotic
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-oxygen"></canvas>
          O₂ Bubble
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-fecal"></canvas>
          Fecal
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-deadfish"></canvas>
          Dead Fish
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-pollutant"></canvas>
          Pollutant
        </div>
        <!-- Hazards -->
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-nh3"></canvas>
          NH₃
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-disease"></canvas>
          Disease
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-parasite"></canvas>
          Parasite
        </div>
        <!-- Obstacle -->
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-obstacle"></canvas>
          Obstacle
        </div>
        <!-- Status glows -->
        <div class="legend-item">
          <div
            class="legend-swatch circle"
            style="
              background: transparent;
              border: 2px solid #ffaa00;
              box-shadow: 0 0 4px #ffaa00;
            "
          ></div>
          Infected
        </div>
        <div class="legend-item">
          <div
            class="legend-swatch circle"
            style="
              background: transparent;
              border: 2px solid #cc44ff;
              box-shadow: 0 0 4px #cc44ff;
            "
          ></div>
          Parasitized
        </div>
        <div class="legend-item">
          <div
            class="legend-swatch circle"
            style="
              background: transparent;
              border: 2px solid #55ffcc;
              box-shadow: 0 0 4px #55ffcc;
            "
          ></div>
          Boosting
        </div>
        <div class="legend-item">
          <canvas class="legend-canvas" id="legend-skull"></canvas>
          Cannibal Kill
        </div>
        <!-- Stat bars -->
        <div class="legend-item">
          <div class="legend-bar" style="background: #e06070"></div>
          HP
        </div>
        <div class="legend-item">
          <div class="legend-bar" style="background: #f0a040"></div>
          Energy
        </div>
        <div class="legend-item">
          <div class="legend-bar" style="background: #88ccff"></div>
          Oxygen
        </div>
        <div class="legend-item">
          <div class="legend-bar" style="background: #ffee55"></div>
          Fullness
        </div>
        <div class="legend-item">
          <div class="legend-bar" style="background: #55ffcc"></div>
          Immunity
        </div>
      </div>

      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="pond-canvas"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("pond-canvas");
      const ctx = canvas.getContext("2d");

      let DATA = null,
        frames = [],
        currentFrame = 0,
        playing = true,
        fps = 3,
        lastTime = 0;
      let scaleX = 1,
        scaleY = 1,
        dpr = 1;
      let killEffects = [];
      const KILL_EFFECT_FRAMES = 25;
      let prevFishIds = new Set();

      const FPS_STEPS = [1, 2, 3, 5, 10, 15, 30, 60, 120];
      let fpsIndex = 2;

      const btnPlay = document.getElementById("btn-play");
      const btnPause = document.getElementById("btn-pause");
      const btnRestart = document.getElementById("btn-restart");
      const btnSlower = document.getElementById("btn-slower");
      const btnFaster = document.getElementById("btn-faster");
      const speedDisplay = document.getElementById("speed-display");
      const frameSlider = document.getElementById("frame-slider");
      const timeDisplay = document.getElementById("time-display");
      const progressBar = document.getElementById("progress-bar");
      const loadingDiv = document.getElementById("loading");

      // ── Bar colors (fixed) ──
      const BAR_HP = "#e06070";
      const BAR_ENERGY = "#f0a040";
      const BAR_OXYGEN = "#88ccff";
      const BAR_FULLNESS = "#ffee55";
      const BAR_IMMUNITY = "#55ffcc";

      // ── Glow colors ──
      const GLOW_INFECTED = "#ffaa00";
      const GLOW_PARASITE = "#cc44ff";
      const GLOW_BOOSTING = "#55ffcc";

      // ── Legend icons ──

      function drawLegendIcons() {
        // Fish (matching pond rendering)
        const fic = document.getElementById("legend-fish");
        const fictx = fic.getContext("2d");
        fic.width = 16;
        fic.height = 16;
        fictx.save();
        fictx.translate(9, 8);
        fictx.fillStyle = "#3a5068";
        fictx.beginPath();
        fictx.ellipse(0, 0, 5, 2.8, 0, 0, Math.PI * 2);
        fictx.fill();
        fictx.strokeStyle = "#2a3a4a";
        fictx.lineWidth = 0.7;
        fictx.stroke();
        // Tail
        fictx.fillStyle = "#2e4458";
        fictx.globalAlpha = 0.8;
        fictx.beginPath();
        fictx.moveTo(-5, 0);
        fictx.lineTo(-7.5, -2.5);
        fictx.lineTo(-7.5, 2.5);
        fictx.closePath();
        fictx.fill();
        fictx.globalAlpha = 1;
        // Eye
        fictx.fillStyle = "#bbb";
        fictx.beginPath();
        fictx.arc(2.5, -0.5, 1, 0, Math.PI * 2);
        fictx.fill();
        fictx.fillStyle = "#111";
        fictx.beginPath();
        fictx.arc(2.8, -0.5, 0.5, 0, Math.PI * 2);
        fictx.fill();
        fictx.restore();

        // Food
        const fc = document.getElementById("legend-food");
        const fctx = fc.getContext("2d");
        fc.width = 16;
        fc.height = 16;
        fctx.fillStyle = "#ffee55";
        fctx.beginPath();
        fctx.arc(8, 8, 4, 0, Math.PI * 2);
        fctx.fill();
        fctx.strokeStyle = "#ccaa22";
        fctx.lineWidth = 0.8;
        fctx.stroke();

        // Probiotic
        const pc = document.getElementById("legend-probiotic");
        const pctx = pc.getContext("2d");
        pc.width = 16;
        pc.height = 16;
        pctx.fillStyle = "#55ffcc";
        pctx.beginPath();
        pctx.arc(8, 8, 4, 0, Math.PI * 2);
        pctx.fill();
        pctx.strokeStyle = "#22aa88";
        pctx.lineWidth = 0.8;
        pctx.stroke();
        pctx.strokeStyle = "#fff";
        pctx.lineWidth = 1;
        pctx.beginPath();
        pctx.moveTo(6, 8);
        pctx.lineTo(10, 8);
        pctx.stroke();
        pctx.beginPath();
        pctx.moveTo(8, 6);
        pctx.lineTo(8, 10);
        pctx.stroke();

        // Oxygen
        const oc = document.getElementById("legend-oxygen");
        const octx = oc.getContext("2d");
        oc.width = 16;
        oc.height = 16;
        octx.fillStyle = "rgba(136,204,255,0.6)";
        octx.beginPath();
        octx.arc(8, 8, 3.5, 0, Math.PI * 2);
        octx.fill();
        octx.strokeStyle = "rgba(136,204,255,0.9)";
        octx.lineWidth = 0.6;
        octx.stroke();

        // Fecal
        const fec = document.getElementById("legend-fecal");
        const fectx = fec.getContext("2d");
        fec.width = 16;
        fec.height = 16;
        fectx.fillStyle = "#8B6914";
        fectx.beginPath();
        fectx.ellipse(8, 10, 4, 2, 0, 0, Math.PI * 2);
        fectx.fill();
        fectx.beginPath();
        fectx.ellipse(8, 7.5, 2.8, 1.8, 0, 0, Math.PI * 2);
        fectx.fill();
        fectx.beginPath();
        fectx.ellipse(8, 5.5, 1.8, 1.2, 0, 0, Math.PI * 2);
        fectx.fill();

        // Dead fish
        const dc = document.getElementById("legend-deadfish");
        const dctx = dc.getContext("2d");
        dc.width = 16;
        dc.height = 16;
        dctx.save();
        dctx.translate(8, 8);
        dctx.rotate(0.4);
        dctx.fillStyle = "#cc2222";
        dctx.beginPath();
        dctx.ellipse(0, 0, 5, 2.5, 0, 0, Math.PI * 2);
        dctx.fill();
        dctx.strokeStyle = "#881111";
        dctx.lineWidth = 0.7;
        dctx.stroke();
        dctx.fillStyle = "#aa1111";
        dctx.beginPath();
        dctx.moveTo(-5, 0);
        dctx.lineTo(-7, -2);
        dctx.lineTo(-7, 2);
        dctx.closePath();
        dctx.fill();
        dctx.strokeStyle = "#ff8888";
        dctx.lineWidth = 1;
        dctx.beginPath();
        dctx.moveTo(1, -1);
        dctx.lineTo(3, 1);
        dctx.stroke();
        dctx.beginPath();
        dctx.moveTo(3, -1);
        dctx.lineTo(1, 1);
        dctx.stroke();
        dctx.restore();

        // Pollutant
        const plc = document.getElementById("legend-pollutant");
        const plctx = plc.getContext("2d");
        plc.width = 16;
        plc.height = 16;
        plctx.fillStyle = "rgba(204,102,0,0.75)";
        plctx.strokeStyle = "rgba(204,102,0,0.9)";
        plctx.lineWidth = 0.8;
        plctx.beginPath();
        plctx.moveTo(8, 2);
        plctx.lineTo(3, 13);
        plctx.lineTo(13, 13);
        plctx.closePath();
        plctx.fill();
        plctx.stroke();
        plctx.fillStyle = "#fff";
        plctx.font = "bold 8px sans-serif";
        plctx.textAlign = "center";
        plctx.fillText("!", 8, 12);

        // NH3 (radial gradient circle matching pond)
        const nh3c = document.getElementById("legend-nh3");
        const nh3ctx = nh3c.getContext("2d");
        nh3c.width = 16;
        nh3c.height = 16;
        const nh3g = nh3ctx.createRadialGradient(8, 8, 0, 8, 8, 7);
        nh3g.addColorStop(0, "rgba(0,255,100,0.4)");
        nh3g.addColorStop(1, "rgba(0,255,100,0.02)");
        nh3ctx.fillStyle = nh3g;
        nh3ctx.beginPath();
        nh3ctx.arc(8, 8, 7, 0, Math.PI * 2);
        nh3ctx.fill();
        nh3ctx.strokeStyle = "rgba(0,255,100,0.6)";
        nh3ctx.lineWidth = 1;
        nh3ctx.stroke();

        // Disease (radial gradient circle matching pond)
        const disc = document.getElementById("legend-disease");
        const disctx = disc.getContext("2d");
        disc.width = 16;
        disc.height = 16;
        const disg = disctx.createRadialGradient(8, 8, 0, 8, 8, 7);
        disg.addColorStop(0, "rgba(255,180,0,0.4)");
        disg.addColorStop(1, "rgba(255,180,0,0.02)");
        disctx.fillStyle = disg;
        disctx.beginPath();
        disctx.arc(8, 8, 7, 0, Math.PI * 2);
        disctx.fill();
        disctx.strokeStyle = "rgba(255,180,0,0.6)";
        disctx.lineWidth = 1;
        disctx.stroke();

        // Parasite (radial gradient circle matching pond)
        const parc = document.getElementById("legend-parasite");
        const parctx = parc.getContext("2d");
        parc.width = 16;
        parc.height = 16;
        const parg = parctx.createRadialGradient(8, 8, 0, 8, 8, 7);
        parg.addColorStop(0, "rgba(200,80,255,0.35)");
        parg.addColorStop(1, "rgba(200,80,255,0.02)");
        parctx.fillStyle = parg;
        parctx.beginPath();
        parctx.arc(8, 8, 7, 0, Math.PI * 2);
        parctx.fill();
        parctx.strokeStyle = "rgba(200,80,255,0.55)";
        parctx.lineWidth = 1;
        parctx.stroke();

        // Obstacle (matching pond rendering)
        const obc = document.getElementById("legend-obstacle");
        const obctx = obc.getContext("2d");
        obc.width = 16;
        obc.height = 16;
        obctx.fillStyle = "#1a3050";
        obctx.fillRect(2, 4, 12, 8);
        obctx.strokeStyle = "#2a5070";
        obctx.lineWidth = 1.5;
        obctx.strokeRect(2, 4, 12, 8);

        // Skull (cannibal kill)
        const skc = document.getElementById("legend-skull");
        const skctx = skc.getContext("2d");
        skc.width = 16;
        skc.height = 16;
        skctx.font = "13px serif";
        skctx.fillStyle = "#ff4444";
        skctx.textAlign = "center";
        skctx.textBaseline = "middle";
        skctx.fillText("\u2620", 8, 9);
      }

      // ── Setup ──

      function setupHiDPI(pw, ph) {
        dpr = window.devicePixelRatio || 1;
        const wrap = document.getElementById("canvas-wrap");
        const cssW = wrap.clientWidth;
        const cssH = cssW * (ph / pw);
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        scaleX = canvas.width / pw;
        scaleY = canvas.height / ph;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      fetch("simulation_data.json")
        .then((r) => {
          if (!r.ok) throw new Error("Not found");
          return r.json();
        })
        .then((data) => {
          DATA = data;
          frames = data.frames;
          setupHiDPI(data.pond_width, data.pond_height);
          frameSlider.max = frames.length - 1;
          loadingDiv.classList.add("hidden");
          populateGenotype();
          drawLegendIcons();
          if (frames.length > 0)
            prevFishIds = new Set(frames[0].fish.map((f) => f.id));
          requestAnimationFrame(loop);
        })
        .catch((err) => {
          loadingDiv.innerHTML = `<div style="color:#ff4c6a;">Could not load simulation_data.json<br>
      <span style="font-size:0.7em;color:#8899aa;">${err.message}</span></div>`;
        });

      // ── Controls ──

      btnPlay.addEventListener("click", () => {
        playing = true;
        btnPlay.classList.add("active");
        btnPause.classList.remove("active");
      });
      btnPause.addEventListener("click", () => {
        playing = false;
        btnPause.classList.add("active");
        btnPlay.classList.remove("active");
      });
      btnRestart.addEventListener("click", () => {
        currentFrame = 0;
        frameSlider.value = 0;
        killEffects = [];
      });
      btnSlower.addEventListener("click", () => {
        fpsIndex = Math.max(0, fpsIndex - 1);
        fps = FPS_STEPS[fpsIndex];
        speedDisplay.textContent = fps + " fps";
      });
      btnFaster.addEventListener("click", () => {
        fpsIndex = Math.min(FPS_STEPS.length - 1, fpsIndex + 1);
        fps = FPS_STEPS[fpsIndex];
        speedDisplay.textContent = fps + " fps";
      });
      frameSlider.addEventListener("input", () => {
        currentFrame = parseInt(frameSlider.value);
      });
      document
        .getElementById("progress-bar-container")
        .addEventListener("click", (e) => {
          const r = e.currentTarget.getBoundingClientRect();
          currentFrame = Math.floor(
            ((e.clientX - r.left) / r.width) * (frames.length - 1),
          );
          frameSlider.value = currentFrame;
        });

      window.addEventListener("resize", () => {
        if (DATA) setupHiDPI(DATA.pond_width, DATA.pond_height);
      });

      // ── Main loop ──

      function loop(ts) {
        requestAnimationFrame(loop);
        if (!frames.length) return;
        if (ts - lastTime < 1000 / fps) return;
        lastTime = ts;
        if (playing)
          currentFrame = Math.min(currentFrame + 1, frames.length - 1);
        frameSlider.value = currentFrame;
        const frame = frames[currentFrame];
        progressBar.style.width =
          (currentFrame / Math.max(1, frames.length - 1)) * 100 + "%";
        const p2 = (n) => String(n).padStart(2, "0");
        const p4 = (n) => String(n).padStart(4, "0");
        timeDisplay.textContent = `Day ${p2(frame.day)} | Hour ${p2(frame.hour)} | Frame ${p4(currentFrame + 1)}/${p4(frames.length)}`;
        detectKills(frame);
        drawFrame(frame);
        updateStats(frame);
      }

      function detectKills(frame) {
        if (frame.cannibal_events) {
          for (const ev of frame.cannibal_events) {
            killEffects.push({
              x: ev.x,
              y: ev.y,
              age: 0,
              max: KILL_EFFECT_FRAMES,
            });
          }
        }
        const curIds = new Set(
          frame.fish.filter((f) => f.alive).map((f) => f.id),
        );
        if (currentFrame > 0) {
          const prev = frames[currentFrame - 1];
          for (const pf of prev.fish) {
            if (pf.alive && !curIds.has(pf.id)) {
              let near = false;
              for (const cf of frame.fish) {
                if (!cf.alive) continue;
                const dx = cf.x - pf.x,
                  dy = cf.y - pf.y;
                if (Math.sqrt(dx * dx + dy * dy) < 15) {
                  near = true;
                  break;
                }
              }
              if (
                near &&
                !frame.cannibal_events?.some(
                  (e) => Math.abs(e.x - pf.x) < 2 && Math.abs(e.y - pf.y) < 2,
                )
              ) {
                killEffects.push({
                  x: pf.x,
                  y: pf.y,
                  age: 0,
                  max: KILL_EFFECT_FRAMES,
                });
              }
            }
          }
        }
        prevFishIds = curIds;
      }

      // ── Drawing helpers ──

      function sx(x) {
        return x * scaleX;
      }
      function sy(y) {
        return y * scaleY;
      }
      function sr(r) {
        return r * Math.min(scaleX, scaleY);
      }

      function drawFrame(frame) {
        const W = canvas.width,
          H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Background
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "#0f3355");
        grad.addColorStop(1, "#0a2238");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "#1e5080";
        ctx.lineWidth = 2 * dpr;
        ctx.strokeRect(1, 1, W - 2, H - 2);

        // Grid
        ctx.strokeStyle = "rgba(30,80,128,0.12)";
        ctx.lineWidth = 0.5 * dpr;
        const gs = 50 * scaleX;
        for (let i = gs; i < W; i += gs) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, H);
          ctx.stroke();
        }
        const gsy = 50 * scaleY;
        for (let i = gsy; i < H; i += gsy) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(W, i);
          ctx.stroke();
        }

        // Hazards
        for (const h of frame.hazards) {
          const cx = sx(h.x),
            cy = sy(h.y),
            r = sr(h.r);
          let c1, c2, sc2, label;
          if (h.type === "nh3") {
            c1 = "rgba(0,255,100,0.25)";
            c2 = "rgba(0,255,100,0.01)";
            sc2 = "rgba(0,255,100,0.4)";
            label = "NH3";
          } else if (h.type === "disease") {
            c1 = "rgba(255,180,0,0.25)";
            c2 = "rgba(255,180,0,0.01)";
            sc2 = "rgba(255,180,0,0.4)";
            label = "Disease";
          } else {
            c1 = "rgba(200,80,255,0.2)";
            c2 = "rgba(200,80,255,0.01)";
            sc2 = "rgba(200,80,255,0.4)";
            label = "Parasite";
          }
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
          g.addColorStop(0, c1);
          g.addColorStop(1, c2);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = sc2;
          ctx.lineWidth = 1 * dpr;
          ctx.stroke();
          ctx.fillStyle = sc2;
          ctx.font = `${9 * dpr}px monospace`;
          ctx.fillText(label, cx - 12 * dpr, cy - r - 2 * dpr);
        }

        // Obstacles
        for (const o of frame.obstacles) {
          const ox = sx(o.x),
            oy = sy(o.y),
            ow = sx(o.w),
            oh = sy(o.h);
          ctx.fillStyle = "#1a3050";
          ctx.fillRect(ox, oy, ow, oh);
          ctx.strokeStyle = "#2a5070";
          ctx.lineWidth = 1.5 * dpr;
          ctx.strokeRect(ox, oy, ow, oh);
        }

        // Objects
        for (const obj of frame.objects) {
          const ox = sx(obj.x),
            oy = sy(obj.y);
          if (obj.type === "food") {
            ctx.fillStyle = "#ffee55";
            ctx.beginPath();
            ctx.arc(ox, oy, 3.5 * dpr, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ccaa22";
            ctx.lineWidth = 0.7 * dpr;
            ctx.stroke();
          } else if (obj.type === "probiotic") {
            ctx.fillStyle = "#55ffcc";
            ctx.beginPath();
            ctx.arc(ox, oy, 3.5 * dpr, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#22aa88";
            ctx.lineWidth = 0.7 * dpr;
            ctx.stroke();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 0.8 * dpr;
            ctx.beginPath();
            ctx.moveTo(ox - 2 * dpr, oy);
            ctx.lineTo(ox + 2 * dpr, oy);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ox, oy - 2 * dpr);
            ctx.lineTo(ox, oy + 2 * dpr);
            ctx.stroke();
          } else if (obj.type === "oxygen") {
            ctx.fillStyle = "rgba(136,204,255,0.45)";
            ctx.beginPath();
            ctx.arc(ox, oy, 2.5 * dpr, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(136,204,255,0.7)";
            ctx.lineWidth = 0.4 * dpr;
            ctx.stroke();
          } else if (obj.type === "fecal") {
            const s = (2.5 + obj.value * 0.3) * dpr;
            ctx.fillStyle = "#8B6914";
            ctx.beginPath();
            ctx.ellipse(ox, oy + s * 0.25, s * 0.6, s * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(
              ox,
              oy - s * 0.05,
              s * 0.4,
              s * 0.25,
              0,
              0,
              Math.PI * 2,
            );
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(
              ox,
              oy - s * 0.3,
              s * 0.25,
              s * 0.18,
              0,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          } else if (obj.type === "dead_fish") {
            ctx.save();
            ctx.translate(ox, oy);
            ctx.rotate(0.4);
            ctx.fillStyle = "#cc2222";
            ctx.beginPath();
            ctx.ellipse(0, 0, 5 * dpr, 2.5 * dpr, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#881111";
            ctx.lineWidth = 0.7 * dpr;
            ctx.stroke();
            ctx.fillStyle = "#aa1111";
            ctx.beginPath();
            ctx.moveTo(-5 * dpr, 0);
            ctx.lineTo(-8 * dpr, -2.5 * dpr);
            ctx.lineTo(-8 * dpr, 2.5 * dpr);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#ff8888";
            ctx.lineWidth = 1 * dpr;
            ctx.beginPath();
            ctx.moveTo(1.5 * dpr, -1.2 * dpr);
            ctx.lineTo(3.5 * dpr, 0.8 * dpr);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(3.5 * dpr, -1.2 * dpr);
            ctx.lineTo(1.5 * dpr, 0.8 * dpr);
            ctx.stroke();
            ctx.restore();
          } else if (obj.type === "pollutant") {
            const s = (3.5 + obj.value * 0.4) * dpr;
            ctx.fillStyle = "rgba(204,102,0,0.65)";
            ctx.strokeStyle = "rgba(204,102,0,0.85)";
            ctx.lineWidth = 0.8 * dpr;
            ctx.beginPath();
            ctx.moveTo(ox, oy - s);
            ctx.lineTo(ox - s * 0.65, oy + s * 0.45);
            ctx.lineTo(ox + s * 0.65, oy + s * 0.45);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            if (s > 4 * dpr) {
              ctx.fillStyle = "#fff";
              ctx.font = `bold ${Math.max(6, s * 0.55)}px sans-serif`;
              ctx.textAlign = "center";
              ctx.fillText("!", ox, oy + s * 0.2);
              ctx.textAlign = "start";
            }
          }
        }

        // Fish
        for (const fish of frame.fish) {
          if (!fish.alive) continue;
          const fx = sx(fish.x),
            fy = sy(fish.y);
          const bs = Math.max(3.5 * dpr, fish.body_size * sr(1) * 0.35);

          // ── Multi-glow (concentric rings) ──
          const glows = [];
          if (fish.is_infected) glows.push(GLOW_INFECTED);
          if (fish.has_parasite) glows.push(GLOW_PARASITE);
          if (fish.is_boosting) glows.push(GLOW_BOOSTING);

          if (glows.length > 0) {
            for (let gi = 0; gi < glows.length; gi++) {
              const glowR = bs + (4 + gi * 3.5) * dpr;
              ctx.save();
              ctx.beginPath();
              ctx.arc(fx, fy, glowR, 0, Math.PI * 2);
              ctx.strokeStyle = glows[gi];
              ctx.lineWidth = 2 * dpr;
              ctx.globalAlpha = 0.7;
              ctx.shadowColor = glows[gi];
              ctx.shadowBlur = 6 * dpr;
              ctx.stroke();
              ctx.restore();
            }
          }

          // Body
          ctx.save();
          ctx.translate(fx, fy);
          ctx.fillStyle = "#3a5068";
          ctx.beginPath();
          ctx.ellipse(0, 0, bs, bs * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#2a3a4a";
          ctx.lineWidth = 0.7 * dpr;
          ctx.stroke();
          // Tail
          ctx.fillStyle = "#2e4458";
          ctx.globalAlpha = 0.8;
          ctx.beginPath();
          ctx.moveTo(-bs, 0);
          ctx.lineTo(-bs - 3.5 * dpr, -2.5 * dpr);
          ctx.lineTo(-bs - 3.5 * dpr, 2.5 * dpr);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
          // Eye
          ctx.fillStyle = "#bbb";
          ctx.beginPath();
          ctx.arc(bs * 0.5, -bs * 0.15, 1.2 * dpr, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#111";
          ctx.beginPath();
          ctx.arc(bs * 0.55, -bs * 0.15, 0.6 * dpr, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // ── Stat bars: HP, Energy, O2, Fullness, Immunity ──
          const barW = bs * 2.2;
          const barH = 1.3 * dpr;
          const barGap = 1.2 * dpr;
          const numBars = 5;
          const barStartY = fy - bs - numBars * (barH + barGap) - 2 * dpr;
          const barX = fx - barW / 2;

          const maxHp = fish.max_hp || 120;
          const maxOxy = 100;
          const maxFull = 80;
          const maxImm = 100;
          const maxEn = 100;

          const bars = [
            {
              pct: Math.max(0, Math.min(1, fish.hp / maxHp)),
              color: BAR_HP,
            },
            {
              pct: Math.max(0, Math.min(1, fish.energy / maxEn)),
              color: BAR_ENERGY,
            },
            {
              pct: Math.max(0, Math.min(1, fish.oxygen / maxOxy)),
              color: BAR_OXYGEN,
            },
            {
              pct: Math.max(0, Math.min(1, fish.fullness / maxFull)),
              color: BAR_FULLNESS,
            },
            {
              pct: Math.max(0, Math.min(1, fish.immunity / maxImm)),
              color: BAR_IMMUNITY,
            },
          ];

          for (let bi = 0; bi < bars.length; bi++) {
            const by = barStartY + bi * (barH + barGap);
            ctx.fillStyle = "rgba(0,0,0,0.35)";
            ctx.fillRect(barX, by, barW, barH);
            ctx.fillStyle = bars[bi].color;
            ctx.fillRect(barX, by, barW * bars[bi].pct, barH);
          }
        }

        // Kill effects
        const kept = [];
        for (const e of killEffects) {
          e.age++;
          if (e.age < e.max) {
            kept.push(e);
            drawKill(e);
          }
        }
        killEffects = kept;

        // HUD
        ctx.fillStyle = "rgba(10,22,40,0.7)";
        ctx.fillRect(4 * dpr, 4 * dpr, 170 * dpr, 22 * dpr);
        ctx.fillStyle = "#5ec4ff";
        ctx.font = `bold ${11 * dpr}px Consolas,monospace`;
        ctx.fillText(
          `Alive: ${frame.alive_count} / ${frame.total_count}`,
          10 * dpr,
          20 * dpr,
        );
      }

      function drawKill(e) {
        const p = e.age / e.max,
          a = 1 - p;
        const ex = sx(e.x),
          ey = sy(e.y),
          r = (6 + p * 25) * dpr;
        ctx.strokeStyle = `rgba(255,30,30,${a * 0.7})`;
        ctx.lineWidth = (2.5 - p * 2) * dpr;
        ctx.beginPath();
        ctx.arc(ex, ey, r, 0, Math.PI * 2);
        ctx.stroke();
        if (p < 0.25) {
          ctx.fillStyle = `rgba(255,80,80,${((0.25 - p) / 0.25) * 0.35})`;
          ctx.beginPath();
          ctx.arc(ex, ey, r * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
        if (a > 0.15) {
          ctx.font = `${(12 + p * 5) * dpr}px serif`;
          ctx.fillStyle = `rgba(255,50,50,${a})`;
          ctx.textAlign = "center";
          ctx.fillText("\u2620", ex, ey - r - 1 * dpr);
          ctx.textAlign = "start";
        }
        for (let i = 0; i < 5; i++) {
          const ang = (i / 5) * Math.PI * 2 + p * 2,
            d = p * 20 * dpr;
          ctx.fillStyle = `rgba(200,20,20,${a * 0.5})`;
          ctx.beginPath();
          ctx.arc(
            ex + Math.cos(ang) * d,
            ey + Math.sin(ang) * d,
            (1 - p) * 2.5 * dpr,
            0,
            Math.PI * 2,
          );
          ctx.fill();
        }
      }

      // ── Stats bar ──

      function updateStats(frame) {
        const alive = frame.fish.filter((f) => f.alive);
        const n = alive.length || 1;
        const total = frame.total_count;
        const sp = (alive.length / total) * 100;
        let sH = 0,
          sE = 0,
          sF = 0,
          sI = 0,
          sO = 0,
          nInf = 0,
          nPar = 0,
          nBst = 0;
        for (const f of alive) {
          sH += f.hp;
          sE += f.energy;
          sF += f.fullness;
          sI += f.immunity;
          sO += f.oxygen;
          if (f.is_infected) nInf++;
          if (f.has_parasite) nPar++;
          if (f.is_boosting) nBst++;
        }
        const fm = (v) => (v / n).toFixed(1);

        document.getElementById("stats-bar").innerHTML = `
          <div class="stat-chip"><span class="stat-chip-label">Survival</span><span class="stat-chip-value">${sp.toFixed(1)}% (${alive.length}/${total})</span></div>
          <div class="stat-chip"><span class="stat-chip-label">HP</span><span class="stat-chip-value">${fm(sH)}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Energy</span><span class="stat-chip-value">${fm(sE)}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Fullness</span><span class="stat-chip-value">${fm(sF)}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Immunity</span><span class="stat-chip-value">${fm(sI)}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">O₂</span><span class="stat-chip-value">${fm(sO)}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Infected</span><span class="stat-chip-value">${nInf}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Parasitized</span><span class="stat-chip-value">${nPar}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Boosting</span><span class="stat-chip-value">${nBst}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Objects</span><span class="stat-chip-value">${frame.objects.length}</span></div>
          <div class="stat-chip"><span class="stat-chip-label">Hazards</span><span class="stat-chip-value">${frame.hazards.length}</span></div>
        `;
      }

      function populateGenotype() {
        if (!DATA) return;
        const g = DATA.genotype;
        const L = (v) => ["Middle", "Corner", "Random"][v] || "?";
        document.getElementById("genotype-bar").innerHTML = `
          <div class="geno-chip"><span class="geno-chip-label">Fitness:</span><span class="geno-chip-value">${DATA.fitness.toFixed(4)}</span></div>
          <div class="geno-chip"><span class="geno-chip-label">Survival:</span><span class="geno-chip-value">${(DATA.survival_rate * 100).toFixed(1)}%</span></div>
          <div class="geno-chip"><span class="geno-chip-label">Cost:</span><span class="geno-chip-value">$${DATA.cost.toFixed(2)}</span></div>
          <div class="geno-chip"><span class="geno-chip-label">Food:</span><span class="geno-chip-value">${g.food_quantity}× / ${g.food_interval}h @ ${L(g.food_location)}</span></div>
          <div class="geno-chip"><span class="geno-chip-label">Prob:</span><span class="geno-chip-value">${g.probiotic_quantity}× / ${g.probiotic_interval}h @ ${L(g.probiotic_location)}</span></div>
          <div class="geno-chip"><span class="geno-chip-label">O₂:</span><span class="geno-chip-value">${g.oxygen_duration}h / ${g.oxygen_interval}h @ ${L(g.oxygen_location)}</span></div>
        `;
      }
    </script>
  </body>
</html>
